<!doctype html>
<html lang="ms">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f7faf8">
  <title>Lokasi Rumah</title>
  <style>
    :root { color-scheme: light; --green:#147d52; --ink:#17231d; --muted:#65736b; }
    * { box-sizing: border-box; }
    body { margin:0; min-height:100vh; display:grid; place-items:center; padding:24px;
      font-family:system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;
      background:linear-gradient(160deg,#eef8f1 0%,#f8faf9 52%,#edf4ff 100%); color:var(--ink); }
    main { width:min(100%,420px); background:#fff; border:1px solid #e3ebe5; border-radius:28px;
      padding:30px 24px; box-shadow:0 18px 60px rgba(26,58,40,.09); text-align:center; }
    .icon { width:72px;height:72px;display:grid;place-items:center;margin:0 auto 18px;border-radius:22px;
      background:#e4f5e9;font-size:34px; }
    h1 { font-size:28px; margin:0 0 10px; letter-spacing:-.7px; }
    p { color:var(--muted); line-height:1.55; margin:0 0 24px; }
    .btn { display:flex;align-items:center;gap:14px;width:100%;padding:16px;margin-top:12px;
      border-radius:16px;text-align:left;text-decoration:none;color:var(--ink);
      border:1px solid #e4ebe6;background:#fbfdfb;transition:transform .12s ease,box-shadow .12s ease; }
    .btn:active { transform:scale(.99); }
    .logo { width:46px;height:46px;display:grid;place-items:center;border-radius:13px;font-size:24px;flex-shrink:0; }
    .maps .logo { background:#e8f0fe; } .waze .logo { background:#e4f7e9; }
    .label { font-weight:700;display:block;font-size:16px; }
    .desc { display:block;font-size:13px;color:var(--muted);margin-top:3px; }
    .arrow { margin-left:auto;color:#87948b;font-size:22px; }
    footer { font-size:12px;color:#89948d;margin-top:24px; }
  </style>
</head>
<body>
  <main>
    <div class="icon" aria-hidden="true">🏡</div>
    <h1>Lokasi Rumah</h1>
    <p>Pilih aplikasi navigasi yang kau gunakan untuk menuju ke sini.</p>
    <a class="btn maps" href="https://www.google.com/maps/search/?api=1&amp;query=6.143312%2C100.384949" target="_blank" rel="noopener noreferrer">
      <span class="logo" aria-hidden="true">📍</span>
      <span><span class="label">Buka Google Maps</span><span class="desc">Lihat lokasi dan arah perjalanan</span></span>
      <span class="arrow" aria-hidden="true">›</span>
    </a>
    <a class="btn waze" href="https://waze.com/ul?ll=6.143312%2C100.384949&amp;navigate=yes" target="_blank" rel="noopener noreferrer">
      <span class="logo" aria-hidden="true">🚗</span>
      <span><span class="label">Buka Waze</span><span class="desc">Mulakan navigasi ke lokasi</span></span>
      <span class="arrow" aria-hidden="true">›</span>
    </a>
    <footer>Jika aplikasi tidak terbuka, pastikan ia dipasang pada telefon.</footer>
  </main>
</body>
</html>
